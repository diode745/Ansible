- hosts: mariadbservers
  become: yes

  tasks:
    - name: Install phpMyAdmin stack
      ansible.builtin.apt:
        name:
          - apache2
          - mariadb-server
          - php
          - php-mysql
          - phpmyadmin
          - php-mbstring
        state: present
        update_cache: yes

    - name: Enable phpMyAdmin Apache config
      ansible.builtin.file:
        src: /etc/phpmyadmin/apache.conf
        dest: /etc/apache2/conf-enabled/phpmyadmin.conf
        state: link

    - name: Enable mbstring
      ansible.builtin.command: phpenmod mbstring
      notify: restart apache

    - name: Ensure Apache running
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

  handlers:
    - name: restart apache
      ansible.builtin.service:
        name: apache2
        state: restarted

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apache2
      - mariadb-server
      - php
      - php-mysql
      - phpmyadmin
    state: present
    update_cache: yes

- name: Enable Apache rewrite module
  ansible.builtin.command: a2enmod rewrite
  notify: restart apache

- name: Ensure Apache is running
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: yes

- name: Ensure MariaDB is running
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: yes

handlers:
  - name: restart apache
    ansible.builtin.service:
      name: apache2
      state: restarted
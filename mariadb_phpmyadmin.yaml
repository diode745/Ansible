- hosts: web
  become: yes

  tasks:
    - name: Install Apache, MariaDB, PHP and phpMyAdmin
      ansible.builtin.apt:
        name:
          - apache2
          - mariadb-server
          - php
          - php-mysql
          - phpmyadmin
        state: present
        update_cache: yes

    - name: Start Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: yes

    - name: Start MariaDB
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

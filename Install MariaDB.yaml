- name: Install MariaDB
  hosts: mariadbservers
  become: true

  tasks:

    -  name: Update apt-get repo and cache
       apt: update_cache=yes force_apt_get=yes cache_valid_time=3600

    -  name: Install MariaDB
       ansible.builtin.apt:
         name: mariadb-server
         state: present
         update_cache: yes
    
    -  name: Start MariaDB
       service:
         name: mariadb
         state: started
         enabled: yes               

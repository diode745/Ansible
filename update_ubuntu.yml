---
# =============================================================================
# Ubuntu Server Update Playbook — Semaphore UI Edition
# =============================================================================
#
# Semaphore Template Settings:
#   Playbook File  : update_ubuntu.yml
#   Inventory      : (select your Semaphore inventory)
#   Environment    : (select your Semaphore environment)
#
# Semaphore Survey Variables (Extra Variables):
#   reboot_if_required  : false   — set true to auto-reboot after kernel update
#   serial_count        : 100%    — e.g. "1" for rolling, "50%" for half at a time
#   update_type         : full    — "full", "security", or "cache_only"
#   target_hosts        : all     — override to limit to a group (e.g. "webservers")
#
# =============================================================================

- name: Update Ubuntu Servers
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  serial: "{{ serial_count | default('100%') }}"

  vars:
    reboot_if_required: "{{ reboot_if_required | default(false) | bool }}"
    reboot_timeout: 300
    update_type: "{{ update_type | default('full') }}"   # full | security | cache_only
    autoremove_packages: true
    autoclean_cache: true
    update_cache_valid_time: 3600

  pre_tasks:
    - name: Verify target OS is Ubuntu
      assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "This playbook only supports Ubuntu (found: {{ ansible_distribution }})"
        success_msg: "Ubuntu {{ ansible_distribution_version }} confirmed"
      tags: [always]

    - name: Display pre-update server info
      debug:
        msg: >-
          [PRE-UPDATE] {{ inventory_hostname }} |
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }} |
          Kernel: {{ ansible_kernel }} |
          Update type: {{ update_type }}
      tags: [always]

  tasks:
    # ── Cache ──────────────────────────────────────────────────────────────
    - name: Update apt package cache
      apt:
        update_cache: true
        cache_valid_time: "{{ update_cache_valid_time }}"
      tags: [apt, cache]

    - name: Stop here if cache_only
      meta: end_host
      when: update_type == "cache_only"
      tags: [always]

    # ── Security-only updates ──────────────────────────────────────────────
    - name: Apply security updates
      apt:
        upgrade: dist
        default_release: "{{ ansible_distribution_release }}-security"
      register: security_result
      when: update_type in ['security', 'full']
      tags: [apt, security]

    # ── Full upgrade ───────────────────────────────────────────────────────
    - name: Safe package upgrade
      apt:
        upgrade: safe
        force_apt_get: true
      register: safe_upgrade_result
      when: update_type == 'full'
      tags: [apt, upgrade]

    - name: Dist-upgrade (resolve dependency changes)
      apt:
        upgrade: dist
        force_apt_get: true
      register: dist_upgrade_result
      when: update_type == 'full'
      tags: [apt, dist-upgrade]

    # ── Cleanup ────────────────────────────────────────────────────────────
    - name: Remove unused packages (autoremove)
      apt:
        autoremove: true
        purge: true
      when: autoremove_packages | bool
      tags: [apt, cleanup]

    - name: Clean apt cache
      apt:
        autoclean: true
      when: autoclean_cache | bool
      tags: [apt, cleanup]

    # ── Snap ───────────────────────────────────────────────────────────────
    - name: Check if snapd is present
      command: which snap
      register: snap_check
      changed_when: false
      failed_when: false
      tags: [snap]

    - name: Update snap packages
      command: snap refresh
      register: snap_result
      changed_when: "'All snaps up to date' not in snap_result.stdout"
      when:
        - snap_check.rc == 0
        - update_type == 'full'
      tags: [snap]

    # ── Reboot handling ────────────────────────────────────────────────────
    - name: Check if reboot is required
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: [reboot]

    - name: Read packages requiring reboot
      command: cat /var/run/reboot-required.pkgs
      register: reboot_packages
      changed_when: false
      failed_when: false
      when: reboot_required_file.stat.exists
      tags: [reboot]

    - name: Reboot notice (reboot disabled)
      debug:
        msg: >-
          REBOOT REQUIRED on {{ inventory_hostname }}.
          Packages: {{ reboot_packages.stdout_lines | default([]) | join(', ') }}.
          Enable reboot_if_required in Semaphore Extra Variables to auto-reboot.
      when:
        - reboot_required_file.stat.exists
        - not reboot_if_required | bool
      tags: [reboot]

    - name: Reboot server (auto-reboot enabled)
      reboot:
        msg: "Rebooting via Semaphore — post-update reboot"
        connect_timeout: 5
        reboot_timeout: "{{ reboot_timeout }}"
        pre_reboot_delay: 5
        post_reboot_delay: 30
        test_command: uptime
      when:
        - reboot_required_file.stat.exists
        - reboot_if_required | bool
      tags: [reboot]

  post_tasks:
    - name: Refresh facts after update
      setup:
        gather_subset: ["!all", "!min", hardware]
      tags: [always]

    - name: Post-update summary
      debug:
        msg: >-
          [DONE] {{ inventory_hostname }} |
          Kernel: {{ ansible_kernel }} |
          Reboot needed: {{ reboot_required_file.stat.exists | default(false) }} |
          APT changes: {{ (safe_upgrade_result.changed | default(false)) or
                          (dist_upgrade_result.changed | default(false)) or
                          (security_result.changed | default(false)) }}
      tags: [always]
